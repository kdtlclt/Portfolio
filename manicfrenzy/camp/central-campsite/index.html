<!DOCTYPE html>
<!-- Character Camp -->
 <html>
	<head>
		<link rel="stylesheet" href="../../style.css">
		<link href="https://fonts.googleapis.com/css2?family=Salsa&family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
		<link rel="icon" type="image/png" href="../../images/favicon.ico">
		<title>MF | CENTRAL CAMPSITE</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	
    <body class="background">
		<div class="all-windows">
		
			<div class="vertical-divide">
					<div class="top-vert">
						<div class="bar-top-vert">
							<img src="../../images/icontext/sponsored.png" alt="Ads" class="bar-img">
							<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
						</div>

						<div class="window-top-vert">
							<a href="../../advertising/luuranko.png" class="ad">
							<img src="../../images/ads/luurangot.jpg" alt="vitulurangot">
						</a>
						<a href="../../advertising/FREE_VIRUS.txt" download class="ad">
							<img src="../../images/ads/freevirus.png" alt="Virus ad">
						</a>
						</div>
					</div>
					
					<div class="bottom-vert">
						<div class="radio-container">
							<iframe 
								class="radio-content"
								src="https://www.youtube-nocookie.com/embed/DD7LM81apjI?autoplay=1&controls=0&loop=1&playlist=DD7LM81apjI" 
								title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
								referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
							</iframe>
							<img src="../../images/radio.gif" class="radio">
						</div>
					</div>
				</div>
		
		
		
			<div class="middle">
				<div class="bar">
					<img src="../../images/icontext/campmenu.png" alt="camp" class="bar-img">
					<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
				</div>
				
				<div class="window-middle-camp">
					<a href="../../home/index.html" class="back-button">
						<picture>
							<source srcset="../../images/back_mob.png" media="(max-width: 766px)">
							<img src="../../images/back.png" alt="Go Back">
						</picture>
					</a>
					
					<img class="camp-frame" src="../reunus.png">
					
					
					
					<div class="campsite">
						
						<div class="dark-overlay">
							<div class="oc-panel">
								<button class="overlay-close">
									<img src="../rasti.png">
								</button>
								
								<h1 class="oc-name"></h1>
								<p class="oc-desc"></p>
								<div class="oc-images"></div>
								
								<div class="artfight-container">
									<a class="artfight-link" target="_blank">
										<img src="../artfight-link.png">
									</a>
								</div>
							</div>
						</div>
						
						<!-- Wanderers -->
						<div class="wanderer" data-oc="lyssa">
							<div class="bounce-wrapper">
								<img src="../ocAssets/lyssa/lyssa-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="feli">
							<div class="bounce-wrapper">
								<img src="../ocAssets/feli/feli-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="person">
							<div class="bounce-wrapper">
								<img src="../ocAssets/person/person-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="sylvia">
							<div class="bounce-wrapper">
								<img src="../ocAssets/sylvia/sylvia-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="eni">
							<div class="bounce-wrapper">
								<img src="../ocAssets/eni/eni-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="keeper1">
							<div class="bounce-wrapper">
								<img src="../ocAssets/keepers/keeper1-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="keeper2">
							<div class="bounce-wrapper">
								<img src="../ocAssets/keepers/keeper2-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="keeper3">
							<div class="bounce-wrapper">
								<img src="../ocAssets/keepers/keeper3-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="laria">
							<div class="bounce-wrapper">
								<img src="../ocAssets/laria/laria-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="valentine">
							<div class="bounce-wrapper">
								<img src="../ocAssets/valentine/valentine-w.png">
							</div>
						</div>
						

					</div>
					
				</div>
				
			</div>
	
	
	
			<div class="verticalwindow">
				<div class="bar">
					<img src="../../images/icontext/signs.png" alt="camp" class="bar-img">
					<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
				</div>
				
				<div class="window-right-signs">
					
					<br><br>
					<a href="../critter-campsite/index.html">
						<img src="../camp-signs/crittersign.png" class="signtitle">
					</a>
					
				</div>
				
			</div>
	
		</div>
	<script src="../campscript.js"></script>
    </body>
</html>
