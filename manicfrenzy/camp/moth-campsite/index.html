<!DOCTYPE html>
<!-- Character Camp -->
 <html>
	<head>
		<link rel="stylesheet" href="../../style.css">
		<link href="https://fonts.googleapis.com/css2?family=Salsa&family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
		<link rel="icon" type="image/png" href="../../images/favicon.ico">
		<title>MF | MOTH CAMPSITE</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	
    <body class="background">
		<div class="all-windows">
		
			<div class="vertical-divide">
					<div class="top-vert">
						<div class="bar-top-vert">
							<img src="../../images/icontext/sponsored.png" alt="Ads" class="bar-img">
							<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
						</div>

						<div class="window-top-vert">
							<a href="https://en.wikipedia.org/wiki/Substance_abuse" class="ad">
								<img src="../../images/ads/heroin.png" alt="heroin ad"">
							</a>
						</div>
					</div>
					
					<div class="bottom-vert">
						<div class="radio-container">
							<iframe 
								class="radio-content"
								src="https://www.youtube-nocookie.com/embed/OjlLtAU4g-A?autoplay=1&controls=0&loop=1&playlist=OjlLtAU4g-A" 
								title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
								referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
							</iframe>
							<img src="../../images/radio.gif" class="radio">
						</div>
					</div>
				</div>
		
		
		
			<div class="middle">
				<div class="bar">
					<img src="../../images/icontext/campmenu.png" alt="camp" class="bar-img">
					<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
				</div>
				
				<div class="window-middle-camp">
					<a href="../../home/index.html" class="back-button">
						<picture>
							<source srcset="../../images/back_mob.png" media="(max-width: 766px)">
							<img src="../../images/back.png" alt="Go Back">
						</picture>
					</a>
					
					<img class="camp-frame" src="mothreuna.png">
					
					
					
					<div class="campsite" style="background-image: url('moth-bg.png');">
						
						<div class="dark-overlay">
							<div class="oc-panel">
								<button class="overlay-close">
									<img src="../rasti.png">
								</button>
								
								<h1 class="oc-name"></h1>
								<p class="oc-desc"></p>
								<div class="oc-images"></div>
								
								<div class="artfight-container">
									<a class="artfight-link" target="_blank">
										<img src="../artfight-link.png">
									</a>
								</div>
							</div>
						</div>
						
						<!-- Wanderers -->
						<div class="wanderer" data-oc="cinnamon">
							<div class="bounce-wrapper">
								<img src="../ocAssets/cinnamon/cinnamon-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="crimson">
							<div class="bounce-wrapper">
								<img src="../ocAssets/crimson/crimson-w.png">

						</div>
						<div class="wanderer" data-oc="sphinx">
							<div class="bounce-wrapper">

						</div>
						<div class="wanderer" data-oc="keri">
							<div class="bounce-wrapper">
								<img src="../ocAssets/keri/keri-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="vesta">
							<div class="bounce-wrapper">
								<img src="../ocAssets/vesta/vesta-w.png">

						<div class="wanderer" data-oc="maple">
							<div class="bounce-wrapper">

						</div>
						<div class="wanderer" data-oc="belle">
							<div class="bounce-wrapper">
								<img src="../ocAssets/belle/belle-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="carina">
							<div class="bounce-wrapper">
								<img src="../ocAssets/carina/carina-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="mallory">
							<div class="bounce-wrapper">
								<img src="../ocAssets/mallory/mallory-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="silk">
							<div class="bounce-wrapper">
								<img src="../ocAssets/silk/silk-w.png">
							</div>
						</div>
						
					</div>
					
				</div>
				
			</div>
	
	
	
			<div class="verticalwindow">
				<div class="bar">
					<img src="../../images/icontext/signs.png" alt="camp" class="bar-img">

					<a href="../butterfly-campsite/index.html">

					</a>
					<!--<a href="../moth-campsite/index.html">
						<img src="../camp-signs/mothsign.png" class="signtitle">

			</div>
	
		</div>
