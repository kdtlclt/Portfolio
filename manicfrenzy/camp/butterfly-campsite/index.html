<!DOCTYPE html>
<!-- Character Camp -->
 <html>
	<head>
		<link rel="stylesheet" href="../../style.css">
		<link href="https://fonts.googleapis.com/css2?family=Salsa&family=Shadows+Into+Light&family=Special+Elite&display=swap" rel="stylesheet">
		<link rel="icon" type="image/png" href="../../images/favicon.ico">
		<title>MF | BUTTERFLY CAMPSITE</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
	</head>
	
    <body class="background">
		<div class="all-windows">
		
			<div class="vertical-divide">
					<div class="top-vert">
						<div class="bar-top-vert">
							<img src="../../images/icontext/sponsored.png" alt="Ads" class="bar-img">
							<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
						</div>

						<div class="window-top-vert">
							<a href="../../advertising/cruise.png" class="ad">
								<img src="../../images/ads/cruise.png" alt="cruise ad">
							</a>
							<a href="../../advertising/curse/index.html" class="ad">
								<img src="../../images/ads/karjuvaha.png" alt="statue ad">
							</a>
						</div>
					</div>
					
					<div class="bottom-vert">
						<div class="radio-container">
							<iframe 
								class="radio-content"
								src="https://www.youtube-nocookie.com/embed/nDymp1LtoWQ?autoplay=1&controls=0&loop=1&playlist=nDymp1LtoWQ" 
								title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
								referrerpolicy="strict-origin-when-cross-origin" allowfullscreen>
							</iframe>
							<img src="../../images/radio.gif" class="radio">
						</div>
					</div>
				</div>
		
		
		
			<div class="middle">
				<div class="bar">
					<img src="../../images/icontext/campmenu.png" alt="camp" class="bar-img">
					<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
				</div>
				
				<div class="window-middle-camp">
					<a href="../../home/index.html" class="back-button">
						<picture>
							<source srcset="../../images/back_mob.png" media="(max-width: 766px)">
							<img src="../../images/back.png" alt="Go Back">
						</picture>
					</a>
					
					<img class="camp-frame" src="bfreuna.png">
					
					
					
					<div class="campsite" style="background-image: url('bf-bg.png');">
						
						<div class="dark-overlay">
							<div class="oc-panel">
								<button class="overlay-close">
									<img src="../rasti.png">
								</button>
								
								<h1 class="oc-name"></h1>
								<p class="oc-desc"></p>
								<div class="oc-images"></div>
								
								<div class="artfight-container">
									<a class="artfight-link" target="_blank">
										<img src="../artfight-link.png">
									</a>
								</div>
							</div>
						</div>
						
						<!-- Wanderers -->
						<div class="wanderer" data-oc="apollo">
							<div class="bounce-wrapper">
								<img src="../ocAssets/apollo/apollo-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="stripes">
							<div class="bounce-wrapper">
								<img src="../ocAssets/stripes/stripes-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="sail">
							<div class="bounce-wrapper">
								<img src="../ocAssets/sail/sail-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="sorrow">
							<div class="bounce-wrapper">
								<img src="../ocAssets/sorrow/sorrow-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="rose">
							<div class="bounce-wrapper">
								<img src="../ocAssets/rose/rose-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="resin">
							<div class="bounce-wrapper">
								<img src="../ocAssets/resin/resin-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="sully">
							<div class="bounce-wrapper">
								<img src="../ocAssets/sully/sully-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="rook">
							<div class="bounce-wrapper">
								<img src="../ocAssets/rook/rook-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="lehti">
							<div class="bounce-wrapper">
								<img src="../ocAssets/lehti/lehti-w.png">
							</div>
						</div>
						<div class="wanderer" data-oc="angel">
							<div class="bounce-wrapper">
								<img src="../ocAssets/angel/angel-w.png">
							</div>
						</div>
						
					</div>
					
				</div>
				
			</div>
	
	
	
			<div class="verticalwindow">
				<div class="bar">
					<img src="../../images/icontext/signs.png" alt="camp" class="bar-img">
					<img src="../../images/icontext/menu.png" alt="menu" class="bar-menu">
				</div>
				
				<div class="window-right-signs">
					
					<br><br>
					<a href="../central-campsite/index.html">
						<img src="../camp-signs/centralsign.png" class="signtitle">
					</a>
					<a href="../critter-campsite/index.html">
						<img src="../camp-signs/crittersign.png" class="signtitle">
					</a>
					<!--<a href="../butterfly-campsite/index.html">
						<img src="../camp-signs/butterflysign.png" class="signtitle">
					</a>-->
					<a href="../moth-campsite/index.html">
						<img src="../camp-signs/mothsign.png" class="signtitle">
					</a>
					<a href="../unsafe-campsite/index.html" class="hidden-sign">
						<img src="../camp-signs/nsfwsign.png" class="signtitle">
					</a>
					
				</div>
				
			</div>
	
		</div>
	<script src="../campscript.js"></script>
    </body>
</html>
